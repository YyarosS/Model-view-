<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Гитара - AR.js</title>
  
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/dist/aframe/build/ar.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    
    .header {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      pointer-events: auto;
    }
    
    .header h1 {
      font-size: 1.3rem;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    
    .footer {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      pointer-events: auto;
    }
    
    .marker-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.9rem;
      transition: background 0.3s;
    }
    
    .marker-link:hover {
      background: #45a049;
    }
    
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 30px 50px;
      border-radius: 15px;
      font-size: 1.2rem;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .spinner {
      width: 30px;
      height: 30px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    /* @keyframes spin{
      margin: 0;
      padding: 0;
      box-sizing: 1px black border-box;
    } */
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    
    .header {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      pointer-events: auto;
    }
    
    .header h1 {
      font-size: 1.3rem;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }
    
    .footer {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      pointer-events: auto;
    }
    
    .marker-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      font-size: 0.9rem;
      transition: background 0.3s;
    }
    
    .marker-link:hover {
      background: #45a049;
    }
    
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 30px 50px;
      border-radius: 15px;
      font-size: 1.2rem;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .spinner {
      width: 30px;
      height: 30px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error-message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.9);
      color: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      z-index: 2000;
      display: none;
      max-width: 90%;
    }
    
    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Индикатор загрузки -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Загрузка камеры...</span>
  </div>
  
  <!-- Сообщение об ошибке -->
  <div class="error-message" id="error">
    <h2>⚠️ Ошибка</h2>
    <p id="error-text">Не удалось получить доступ к камере</p>
    <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: white; color: red; border: none; border-radius: 5px; cursor: pointer;">
      Повторить
    </button>
  </div>

  <!-- UI Overlay -->
  <div class="ui-overlay">
    <div class="header">
      <h1>🎸 Электрогитара в AR</h1>
      <p>Наведите камеру на маркер Hiro</p>
    </div>
    
    <div class="footer">
      <p>Маркер не распознан? Скачайте его:</p>
      <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" 
         target="_blank" 
         class="marker-link">
        📥 Скачать маркер Hiro
      </a>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    vr-mode-ui="enabled: false">
    
    <!-- Маркер Hiro -->
    <a-marker preset="hiro" emitevents="true">
      <!-- 3D модель гитары -->
      <a-gltf-model 
        id="guitar"
        src="models/electric_guitar_explorer.glb"
        position="0 0 0"
        scale="0.3 0.3 0.3"
        rotation="-90 0 0"
        animation-mixer>
      </a-gltf-model>
      
      <!-- Альтернатива: простой куб если модель не загрузится -->
      <!--
      <a-box 
        position="0 0.5 0" 
        material="color: #4CAF50; opacity: 0.8"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
      </a-box>
      -->
    </a-marker>
    
    <!-- Камера -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const errorText = document.getElementById('error-text');
    const scene = document.querySelector('a-scene');
    
    // Скрыть индикатор загрузки когда сцена готова
    scene.addEventListener('loaded', () => {
      setTimeout(() => {
        loading.style.display = 'none';
      }, 1000);
    });
    
    // Обработка ошибок доступа к камере
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        console.log('Камера доступна');
        stream.getTracks().forEach(track => track.stop());
      })
      .catch(err => {
        loading.style.display = 'none';
        error.classList.add('show');
        errorText.textContent = 'Ошибка: ' + err.message;
        console.error('Camera error:', err);
      });
    
    // Обработка обнаружения маркера
    const marker = document.querySelector('a-marker');
    marker.addEventListener('markerFound', () => {
      console.log('✅ Маркер найден!');
    });
    
    marker.addEventListener('markerLost', () => {
      console.log('❌ Маркер потерян');
    });
    
    // Проверка загрузки модели
    const guitar = document.getElementById('guitar');
    guitar.addEventListener('model-loaded', () => {
      console.log('✅ Модель загружена');
    });
    
    guitar.addEventListener('error', (e) => {
      console.error('❌ Ошибка загрузки модели:', e);
      // Можно показать fallback объект
    });
  </script>
</body>
</html>
