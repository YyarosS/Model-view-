<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR</title>
  
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
</head>
<body>
  <!-- Индикатор загрузки -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Инициализация AR...</span>
  </div>
    
    <div class="controls">
      <button class="btn" id="placeBtn" disabled>📍 Разместить гитару</button>
      <button class="btn" id="resetBtn">🔄 Сбросить</button>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene 
    embedded 
    mindar-image="imageTargetSrc: ; maxTrack: 1;"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <!-- Камера с отслеживанием поверхности -->
    <a-camera 
      position="0 0 0" 
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
      raycaster="objects: .clickable">
    </a-camera>
    
    <!-- Контейнер для размещенной модели -->
    <a-entity id="guitar-container" visible="false">
      <a-gltf-model 
        id="guitar"
        src="models/electric_guitar_explorer.glb"
        position="0 0 0"
        scale="0.3 0.3 0.3"
        rotation="-90 0 0">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const loading = document.getElementById('loading');
    const placeBtn = document.getElementById('placeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const guitarContainer = document.getElementById('guitar-container');
    const instructions = document.getElementById('instructions');
    
    let isPlaced = false;
    let hitTestResult = null;
    
    // Скрыть загрузку когда сцена готова
    window.addEventListener('load', () => {
      setTimeout(() => {
        loading.style.display = 'none';
        placeBtn.disabled = false;
      }, 2000);
    });
    
    // Обработка клика для размещения объекта
    document.querySelector('a-scene').addEventListener('click', (evt) => {
      if (!isPlaced && evt.detail.intersection) {
        const intersectPoint = evt.detail.intersection.point;
        
        // Размещаем гитару в точке пересечения
        guitarContainer.setAttribute('position', {
          x: intersectPoint.x,
          y: intersectPoint.y,
          z: intersectPoint.z
        });
        guitarContainer.setAttribute('visible', 'true');
        
        isPlaced = true;
        placeBtn.textContent = '✅ Гитара размещена';
        placeBtn.disabled = true;
        
        console.log('Гитара размещена в:', intersectPoint);
      }
    });
    
    // Кнопка размещения
    placeBtn.addEventListener('click', () => {
      if (!isPlaced) {
        instructions.textContent = 'Коснитесь экрана чтобы разместить гитару';
        instructions.style.animation = 'none';
        instructions.style.opacity = '1';
      }
    });
    
    // Кнопка сброса
    resetBtn.addEventListener('click', () => {
      guitarContainer.setAttribute('visible', 'false');
      isPlaced = false;
      placeBtn.textContent = '📍 Разместить гитару';
      placeBtn.disabled = false;
      instructions.textContent = 'Двигайте телефон медленно, чтобы найти поверхность';
      instructions.style.animation = 'fadeInOut 4s ease-in-out';
    });
  </script>
</body>
</html>
