<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2b">
  <title>WebAR</title>
  <script type="module" src="vendor/model-viewer.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="viewer">
      <model-viewer 
        src="models/electric_guitar_explorer.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        camera-controls touch-action="pan-y" auto-rotate
        environment-image="assets/moon_1k.hdr"
        exposure="1"
        shadow-intensity="1" shadow-softness="0.8"
        camera-orbit="25deg 75deg auto">
      </model-viewer>
    </section>
  </main>
</body>
</html>
