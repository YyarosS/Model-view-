<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR с &lt;model-viewer&gt;</title>
    <link rel="stylesheet" href="style.css">
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
    ></script>
</head>
<body>
    <div class="viewer-container">
        <model-viewer
            id="ar-model"
            src="models/electric_guitar_explorer.glb"
            ios-src="models/Electric_guitar_explorer.usdz"
            ar
            ar-modes="scene-viewer quick-look webxr"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            exposure="1"
            tone-mapping="aces"
            interaction-prompt="auto"
            loading="eager"
        >
        </model-viewer>
    </div>

    <script>
        // Обработка ошибок загрузки модели
        const viewer = document.getElementById('ar-model');

        viewer.addEventListener('error', (event) => {
            console.error('Ошибка загрузки модели:', event.detail?.sourceError);
        });

        viewer.addEventListener('load', () => {
            console.log('✅ Модель успешно загружена');
        });
    </script>
</body>
</html>
