<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR с &lt;model-viewer&gt;</title>

    <!-- Подключение компонента model-viewer через CDN Google -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"
    ></script>
</head>
<body>

    <h1>🚀 Интерактивная 3D-модель в WebAR</h1>
    <p class="subtitle">
        Вращайте модель пальцем или мышью. Нажмите кнопку
        <span class="badge">View in your space</span>
        для размещения в дополненной реальности.
    </p>

    <!-- ====== MODEL-VIEWER КОМПОНЕНТ ====== -->
    <div class="viewer-container">
        <model-viewer
            id="ar-model"
            src="models/electric_guitar_explorer.glb"
            ios-src="models/astronaut.usdz"
            environment-image="hdris/studio_small_09_1k.hdr"
            ar
            ar-modes="scene-viewer quick-look webxr"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            exposure="1"
            tone-mapping="aces"
            interaction-prompt="auto"
            alt="3D-модель астронавта"
            loading="eager"
        >
        </model-viewer>
    </div>

    <script>
        // Обработка ошибок загрузки модели
        const viewer = document.getElementById('ar-model');

        viewer.addEventListener('error', (event) => {
            console.error('Ошибка загрузки модели:', event.detail?.sourceError);
        });

        viewer.addEventListener('load', () => {
            console.log('✅ Модель успешно загружена');
        });
    </script>
</body>
</html>
