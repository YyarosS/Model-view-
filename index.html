<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Гитара - Быстрый старт</title>
  
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar.js"></script>
  
</head>
<body>
  <!-- Экран загрузки -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Загрузка камеры...</div>
  </div>
  
  <!-- Экран ошибки -->
  <div class="error" id="error">
    <h2>⚠️ Ошибка</h2>
    <p id="error-text"></p>
    <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; background: white; color: red; border: none; border-radius: 5px;">
      Повторить
    </button>
  </div>

  <!-- UI -->
  <div class="ui-overlay">
    <div class="header">
      <h1>🎸 AR Гитара</h1>
      <p>Наведите камеру на маркер Kanji ниже</p>
    </div>
    
    <div class="marker-info">
      <p>Маркер для распознавания:</p>
      <!-- Встроенный маркер Kanji -->
      <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/kanji.png" 
           class="marker-img" 
           alt="Kanji Marker">
      <p style="font-size: 0.8rem; margin-top: 10px;">
        Откройте это изображение на другом устройстве<br>
        или распечатайте
      </p>
    </div>
  </div>

  <!-- AR Scene -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="antialias: true; alpha: true;">
    
    <!-- Маркер Kanji -->
    <a-marker preset="kanji" emitevents="true">
      <!-- 3D модель гитары -->
      <a-gltf-model 
        src="models/electric_guitar_explorer.glb"
        position="0 0 0"
        scale="0.3 0.3 0.3"
        rotation="-90 0 0">
      </a-gltf-model>
      
      <!-- Fallback: если модель не загрузится, покажем куб -->
      <!--
      <a-box 
        position="0 0.5 0" 
        material="color: #4CAF50; opacity: 0.8"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
      </a-box>
      -->
    </a-marker>
    
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const errorText = document.getElementById('error-text');
    const scene = document.querySelector('a-scene');
    
    // Скрыть загрузку когда сцена готова
    scene.addEventListener('loaded', () => {
      setTimeout(() => {
        loading.style.display = 'none';
      }, 1000);
    });
    
    // Обработка ошибок камеры
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        console.log('✅ Камера доступна');
        stream.getTracks().forEach(track => track.stop());
      })
      .catch(err => {
        loading.style.display = 'none';
        error.style.display = 'block';
        errorText.textContent = 'Нет доступа к камере: ' + err.message;
        console.error('Camera error:', err);
      });
    
    // Обработка обнаружения маркера
    const marker = document.querySelector('a-marker[preset="kanji"]');
    marker.addEventListener('markerFound', () => {
      console.log('✅ Маркер Kanji найден!');
    });
    
    marker.addEventListener('markerLost', () => {
      console.log('❌ Маркер потерян');
    });
    
    // Проверка загрузки модели
    const model = document.querySelector('a-gltf-model');
    model.addEventListener('model-loaded', () => {
      console.log('✅ Модель загружена');
    });
    
    model.addEventListener('error', (e) => {
      console.error('❌ Ошибка модели:', e);
      // Можно раскомментировать fallback куб выше
    });
  </script>
</body>
</html>
