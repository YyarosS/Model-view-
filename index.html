<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 1 — WebAR с model-viewer</title>
  <link rel="stylesheet" href="style.css">
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>
</head>
<body>
  <model-viewer
    src="models/electric_guitar_explorer.glb"
    ios-src="models/Electric_Guitar_Explorer.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    powerPreference= high-performance
    auto-rotate>
  </model-viewer>
</body>
</html>
